# Déploiement de production : Caddy (HTTPS automatique) → application Nuxt → PostgreSQL.
# Seul Caddy est exposé. La base est sur un réseau interne sans accès à Internet.
# Utilisation : cp .env.example .env ; éditer .env ; docker compose up -d
name: ipnoria-website

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  caddy:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN requis}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-sites:/etc/caddy/sites:ro
      - ./caddy-errors:/srv/errors:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    depends_on:
      app: { condition: service_healthy }
    networks: [edge]

  app:
    <<: *hardening
    image: ${APP_IMAGE:-ghcr.io/vincenttisseront/ipnoria-website:latest}
    build: .
    environment:
      NUXT_DATABASE_URL: postgres://site:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/site
      NUXT_IP_HASH_SALT: ${IP_HASH_SALT:?IP_HASH_SALT requis}
      NUXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
      NUXT_CONTACT_RETENTION_DAYS: ${CONTACT_RETENTION_DAYS:-365}
      NUXT_SMTP_HOST: ${SMTP_HOST:-}
      NUXT_SMTP_PORT: ${SMTP_PORT:-587}
      NUXT_SMTP_SECURE: ${SMTP_SECURE:-false}
      NUXT_SMTP_USER: ${SMTP_USER:-}
      NUXT_SMTP_PASS: ${SMTP_PASS:-}
      NUXT_SMTP_FROM: ${SMTP_FROM:-}
      NUXT_SMTP_TO: ${SMTP_TO:-}
      NUXT_PUBLIC_LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      NUXT_PUBLIC_LEGAL_EMAIL: ${LEGAL_EMAIL:-}
      NUXT_PUBLIC_LEGAL_HOST: ${LEGAL_HOST:-}
      NUXT_SESSION_PASSWORD: ${SESSION_PASSWORD:-}
      NUXT_ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      NUXT_OIDC_ISSUER: ${OIDC_ISSUER:-}
      NUXT_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      NUXT_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      NUXT_PUBLIC_DEMO_URL: ${DEMO_URL:-}
      NUXT_PUBLIC_DEMO_USER: ${DEMO_USER:-}
      NUXT_PUBLIC_DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      NUXT_BOOKING_ENABLED: ${BOOKING_ENABLED:-false}
      NUXT_BOOKING_TIMEZONE: ${BOOKING_TIMEZONE:-Europe/Paris}
      NUXT_BOOKING_DAYS: ${BOOKING_DAYS:-1,2,3,4,5}
      NUXT_BOOKING_TIMES: ${BOOKING_TIMES:-10:00,14:00,16:00}
      NUXT_BOOKING_DURATION_MIN: ${BOOKING_DURATION_MIN:-30}
      NUXT_BOOKING_HORIZON_DAYS: ${BOOKING_HORIZON_DAYS:-14}
      NUXT_BOOKING_MIN_NOTICE_HOURS: ${BOOKING_MIN_NOTICE_HOURS:-24}
      NUXT_BOOKING_MEETING_URL: ${BOOKING_MEETING_URL:-}
      NUXT_BOOKING_BUSY_ICS_URL: ${BOOKING_BUSY_ICS_URL:-}
      NUXT_BOOKING_FEED_KEY: ${BOOKING_FEED_KEY:-}
      NUXT_PUBLIC_ANALYTICS_SRC: ${ANALYTICS_SRC:-}
      NUXT_PUBLIC_ANALYTICS_WEBSITE_ID: ${ANALYTICS_WEBSITE_ID:-}
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      db: { condition: service_healthy }
    # edge : joignable par Caddy et sortie vers GitHub (version publiée) et le relais SMTP ; backend : la base
    networks: [edge, backend]

  db:
    <<: *hardening
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: site
      POSTGRES_USER: site
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - db_data:/var/lib/postgresql/data
    tmpfs: [/tmp, /var/run/postgresql]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site -d site"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  # Statistiques sans cookie (facultatif) : docker compose --profile analytics up -d
  # Servi par Caddy sur stats.<domaine> (fichier caddy-sites/stats.caddy, voir stats.caddy.example)
  umami:
    <<: *hardening
    profiles: [analytics]
    image: ghcr.io/umami-software/umami:3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD:-}@umami-db:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:-}
      DISABLE_TELEMETRY: "1"
      DISABLE_UPDATES: "1"
    cap_drop: [ALL]
    pids_limit: 200
    mem_limit: 512m
    depends_on:
      umami-db: { condition: service_healthy }
    networks: [edge, analytics]

  umami-db:
    <<: *hardening
    profiles: [analytics]
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    tmpfs: [/tmp, /var/run/postgresql]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [analytics]

networks:
  edge: {}
  backend:
    internal: true
  analytics:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
  db_data: {}
  umami_db_data: {}
