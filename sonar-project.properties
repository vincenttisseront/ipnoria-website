# Analyse SonarQube (Cloud ou serveur auto-hébergé), lancée par .github/workflows/ci.yml (job « sonar »).
# Secrets GitHub : SONAR_TOKEN, et SONAR_HOST_URL pour un serveur auto-hébergé (absent = SonarQube Cloud).
sonar.organization=vincenttisseront
sonar.projectKey=vincenttisseront_ddibuntu-site
sonar.projectName=ddibuntu-site

sonar.sources=app,server,shared,nuxt.config.ts,Dockerfile,docker-compose.yml,.github
sonar.tests=tests
sonar.exclusions=**/node_modules/**,.nuxt/**,.output/**,coverage/**,reports/**,public/**
sonar.sourceEncoding=UTF-8

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Pages et composants Vue : couverts par le test de fumée (tests/smoke.mjs), pas par la couverture unitaire
sonar.coverage.exclusions=app/**,nuxt.config.ts,server/plugins/**

# Les deux catalogues de traduction se ressemblent par construction
sonar.cpd.exclusions=i18n/locales/*.json
