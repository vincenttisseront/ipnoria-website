# Sécurité : secrets, dépendances, configuration, Dockerfile, SAST, image, workflows. Chaque push, chaque PR, et chaque lundi
# (une CVE peut apparaître sur du code qui n'a pas changé). Les outils sont ceux de tools/security-scan.sh, épinglés par empreinte.
name: security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: gitleaks (historique complet)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - run: tools/security-scan.sh secrets
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: gitleaks, path: reports/, retention-days: 30 }

  dependencies:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: tools/security-scan.sh deps
      - name: Signatures et provenance des paquets npm
        run: npm audit signatures

  trivy-fs:
    name: Trivy (dépôt)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/security-scan.sh fs

  hadolint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/security-scan.sh dockerfile

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: tools/security-scan.sh sast
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: semgrep, path: reports/, retention-days: 30 }

  image:
    name: Trivy (image) + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: docker build -t ipnoria-website:scan .
      - run: tools/security-scan.sh image ipnoria-website:scan
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sbom, path: reports/sbom.cdx.json, retention-days: 90 }

  workflows:
    name: zizmor (sécurité des workflows GitHub)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: pipx run zizmor==1.* --min-severity medium .github/workflows
        env: { GH_TOKEN: '${{ github.token }}' }
