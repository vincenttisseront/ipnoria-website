---
- name: Contrôle des secrets obligatoires
  ansible.builtin.assert:
    that:
      - vault_postgres_password is defined and vault_postgres_password | length >= 16 and vault_postgres_password != 'CHANGE-ME'
      - vault_ip_hash_salt is defined and vault_ip_hash_salt | length >= 16 and vault_ip_hash_salt != 'CHANGE-ME'
      - >-
          (website_admin_emails | default([])) | length == 0
          or (vault_session_password | default('') | length >= 32
          and vault_accounts_secret | default('') | length >= 32
          and 'CHANGE-ME' not in vault_accounts_secret)
      - >-
          (vault_admin_password | default('')) | length == 0
          or (vault_admin_password | length >= 12 and 'CHANGE-ME' not in vault_admin_password)
      - vault_accounts_secret | default('') | length == 0 or (vault_accounts_secret | length >= 32 and 'CHANGE-ME' not in vault_accounts_secret)
      - not website_analytics_enabled or (vault_umami_db_password | default('') | length >= 16 and vault_umami_app_secret | default('') | length >= 16)
    fail_msg: "Secret manquant ou trop court dans group_vars/all/vault.yml (voir vault.yml.example)."
    quiet: true

- name: Les noms interne et externe sont distincts
  ansible.builtin.assert:
    that:
      - website_internal_domain != website_domain
    fail_msg: "Le domaine interne et le domaine externe doivent être différents."
    quiet: true
  when: (website_internal_domain | default('')) | length > 0

- name: Dossier du site
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  loop:
    - "{{ website_dir }}"
    - "{{ website_dir }}/caddy-sites"
    - "{{ website_dir }}/caddy-errors"
    - "{{ website_dir }}/beta-files"

- name: Fichiers de déploiement (compose, Caddy)
  ansible.builtin.copy:
    src: "{{ website_repo_root }}/{{ item }}"
    dest: "{{ website_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [docker-compose.yml, Caddyfile]
  notify: Relancer le site

- name: Pages d'erreur et de maintenance servies par Caddy
  ansible.builtin.copy:
    src: "{{ website_repo_root }}/caddy-errors/"
    dest: "{{ website_dir }}/caddy-errors/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: Mode maintenance (page 503 tant que website_maintenance est vrai)
  ansible.builtin.file:
    path: "{{ website_dir }}/caddy-errors/maintenance.on"
    state: "{{ 'touch' if website_maintenance | bool else 'absent' }}"
    owner: root
    group: root
    mode: "0644"
    access_time: preserve
    modification_time: preserve

- name: Site des statistiques (Caddy)
  ansible.builtin.copy:
    src: "{{ website_repo_root }}/caddy-sites/stats.caddy.example"
    dest: "{{ website_dir }}/caddy-sites/stats.caddy"
    owner: root
    group: root
    mode: "0644"
  when: website_analytics_enabled
  notify: Relancer le site

- name: Site interne (certificat local, Let's Encrypt ne signe pas ce nom)
  ansible.builtin.template:
    src: internal.caddy.j2
    dest: "{{ website_dir }}/caddy-sites/internal.caddy"
    owner: root
    group: root
    mode: "0644"
  when: (website_internal_domain | default('')) | length > 0
  notify: Relancer le site

- name: Pas de site interne s'il n'est pas défini
  ansible.builtin.file:
    path: "{{ website_dir }}/caddy-sites/internal.caddy"
    state: absent
  when: (website_internal_domain | default('')) | length == 0
  notify: Relancer le site

- name: Pas de site des statistiques s'il est désactivé
  ansible.builtin.file:
    path: "{{ website_dir }}/caddy-sites/stats.caddy"
    state: absent
  when: not website_analytics_enabled
  notify: Relancer le site

- name: Variables d'environnement (secrets, lisibles par root seulement)
  ansible.builtin.template:
    src: env.j2
    dest: "{{ website_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Relancer le site

- name: Connexion au registre d'images privé
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ vault_ghcr_user }}"
    password: "{{ vault_ghcr_token }}"
  no_log: true
  when: website_image is match('ghcr.io/') and (vault_ghcr_token | default('')) not in ['', 'CHANGE-ME']

- name: Démarrage ou mise à jour de la pile
  community.docker.docker_compose_v2:
    project_src: "{{ website_dir }}"
    profiles: "{{ ['analytics'] if website_analytics_enabled else [] }}"
    pull: "{{ website_pull }}"
    remove_orphans: true
    wait: true
    wait_timeout: 300
    state: present
  register: website_compose

# Le fichier du nom interne est monté dans Caddy, mais le processus ne le relit qu'au redémarrage.
# Sans cela, le contrôle interroge l'ancienne configuration et la poignée de main TLS échoue.
- name: Appliquer le rechargement du site avant le contrôle
  ansible.builtin.meta: flush_handlers

# Un passage précédent a pu écrire le fichier puis échouer avant le rechargement :
# le modèle ne change plus, donc rien ne notifie le redémarrage, et Caddy garde l'ancienne configuration.
- name: Noms actuellement servis par Caddy
  ansible.builtin.command:
    cmd: docker compose exec -T caddy wget -qO- http://127.0.0.1:2019/config/
    chdir: "{{ website_dir }}"
  register: caddy_loaded
  changed_when: false
  no_log: true
  when: (website_internal_domain | default('')) | length > 0

- name: Recharger Caddy s'il ne sert pas encore le nom interne
  ansible.builtin.command:
    cmd: docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
    chdir: "{{ website_dir }}"
  when: >-
    (website_internal_domain | default('')) | length > 0
    and website_internal_domain not in (caddy_loaded.stdout | default(''))
  changed_when: true

- name: Le site répond (santé, via le nom interne s'il existe, sinon le nom externe)
  vars:
    website_health_host: "{{ website_internal_domain | default(website_domain, true) }}"
  ansible.builtin.uri:
    url: "https://{{ website_health_host }}/api/health"
    # Le certificat interne est signé par Caddy, pas par une autorité publique.
    validate_certs: "{{ website_health_host != 'localhost' and website_health_host != (website_internal_domain | default('')) }}"
    status_code: 200
  register: website_health
  retries: 20
  delay: 6
  until: website_health.status == 200
  when: website_check_health
