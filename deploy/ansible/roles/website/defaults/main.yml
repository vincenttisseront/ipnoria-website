---
# Racine du dépôt (là où se trouvent docker-compose.yml et Caddyfile)
website_repo_root: "{{ playbook_dir }}/../.."
website_dir: /opt/ipnoria-website
website_image: ghcr.io/vincenttisseront/ipnoria-website:latest
# always : tire la dernière image à chaque passage ; missing : seulement si absente (essais hors ligne)
website_pull: always
website_check_health: true
website_analytics_enabled: false
# Vide : pas d'accès /admin, le mot de passe de session n'est pas exigé.
# Une adresse : "vous@ipnoria.com". Plusieurs : ["a@ipnoria.com", "b@ipnoria.com"].
# L'inventaire (group_vars) remplace cette valeur.
website_admin_emails: []
# Externe : nom public (DNS, certificat Let's Encrypt, adresses du site).
website_domain: www.ipnoria.tech
# Interne : nom du DNS privé. Certificat local de Caddy. Vide = pas de second nom.
# Le contrôle de santé passe par lui quand il est renseigné.
website_internal_domain: ipnoria.ar-systems.fr

# Page de maintenance (503) servie par Caddy à la place du site : -e website_maintenance=true
website_maintenance: false
