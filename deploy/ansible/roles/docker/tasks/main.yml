---
# Docker Engine et le plugin Compose depuis le dépôt officiel de Docker (clé de signature vérifiée par apt)
- name: Paquets Docker des distributions retirés (conflits)
  ansible.builtin.apt:
    name: [docker.io, docker-compose, docker-compose-v2, podman-docker, containerd, runc]
    state: absent

- name: Dossier des clés apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé de signature du dépôt Docker
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Dépôt Docker
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    architectures: ["{{ docker_apt_arch[ansible_facts['architecture']] | default('amd64') }}"]
    signed_by: /etc/apt/keyrings/docker.asc
  notify: Mettre à jour l'index apt

- name: Index apt à jour avant l'installation
  ansible.builtin.meta: flush_handlers

- name: Docker Engine et Compose
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true

- name: Configuration du démon (journaux bornés, sans élévation de privilèges, conteneurs maintenus pendant une mise à jour)
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ docker_daemon_config | combine(docker_daemon_extra) | to_nice_json }}\n"
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer docker

- name: Docker démarré au boot
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Appliquer la configuration du démon maintenant
  ansible.builtin.meta: flush_handlers
