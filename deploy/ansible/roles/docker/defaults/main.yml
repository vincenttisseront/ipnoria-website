---
docker_apt_arch:
  x86_64: amd64
  aarch64: arm64
docker_daemon_config:
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "5"
  live-restore: true
  no-new-privileges: true
  userland-proxy: false
# Réglages supplémentaires propres à un hôte (ex. { "storage-driver": "vfs" } dans un conteneur de test)
docker_daemon_extra: {}
