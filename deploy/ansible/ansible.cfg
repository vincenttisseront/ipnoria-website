# kics-scan disable=c6473dae-8477-4119-88b7-b909b435ce7b
# Pas de no_log global (il masquerait toute la sortie du déploiement) : chaque tâche manipulant un secret
# porte son propre no_log: true (variables d'environnement, coffre).
[defaults]
inventory = inventories/production/hosts.yml
roles_path = roles
stdout_callback = default
result_format = yaml
retry_files_enabled = false
interpreter_python = auto_silent
# Les secrets (group_vars/all/vault.yml) sont chiffrés avec ansible-vault : ajouter --ask-vault-pass,
# ou exporter ANSIBLE_VAULT_PASSWORD_FILE=~/.ansible/ipnoria-website.vault (fichier hors dépôt, mode 0600)
host_key_checking = true

[ssh_connection]
pipelining = true
